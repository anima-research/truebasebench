<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>True Base Bench</title>
    <meta name="description" content="True Base Bench, by Anima Labs: how far each language-model checkpoint sits from a pre-anneal pretraining base, read from its next-token distributions alone." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem("tbb.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("tbb.reduceMotion") === "1") document.documentElement.setAttribute("data-reduce-motion", "");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
