<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>True Base Bench</title>
    <!-- __SITE_URL__ / __SITE_NAME__ / __SITE_DESCRIPTION__ are filled from site.config.json by vite.config.ts (dev and build) -->
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__SITE_NAME__" />
    <meta property="og:description" content="__SITE_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="True Base Bench: calibration gap on post-cutoff text for every measured checkpoint, by stage" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_NAME__" />
    <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
    <meta name="twitter:image" content="__SITE_URL__/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem("tbb.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        if (localStorage.getItem("tbb.reduceMotion") === "1") document.documentElement.setAttribute("data-reduce-motion", "");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
