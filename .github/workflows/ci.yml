name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site (install, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate data bundles and manifest
        run: node ../tools/validate_data.mjs
      - run: npm test
      - run: npm run build
      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/data/manifest.json
          node ../tools/csp.mjs dist/index.html -

  tools:
    name: Data tools (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tools/tests -v
      - name: Upload plan (dry run, no credentials)
        run: python tools/upload_data.py --dry-run

  image:
    name: Docker image (Railway build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t truebasebench:ci .
      - name: Smoke test
        run: |
          docker run -d --name tbb -p 8080:8080 truebasebench:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/data/manifest.json
          # SPA fallback for client routes; real 404 for missing assets
          curl -fsS http://127.0.0.1:8080/findings | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404
          curl -sI http://127.0.0.1:8080/ | grep -qi '^cache-control: no-cache'
          curl -sI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
      - name: Logs
        if: always()
        run: docker logs tbb || true
